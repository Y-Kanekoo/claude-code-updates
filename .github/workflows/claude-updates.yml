name: Claude Code Updates Report

on:
  # 毎日 9:00 JST (0:00 UTC) に自動実行
  schedule:
    - cron: '0 0 * * *'

  # 手動実行も可能
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-updates-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_RELEASES_PER_RUN: ${{ vars.MAX_RELEASES_PER_RUN || '10' }}

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Groq API キーの期限を確認
        env:
          CLAUDE_UPDATES_GROQ_API_KEY_EXPIRES_AT: ${{ vars.CLAUDE_UPDATES_GROQ_API_KEY_EXPIRES_AT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.CLAUDE_UPDATES_DISCORD_WEBHOOK_URL }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/check-groq-key-expiry.py

      - name: 依存パッケージをインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: レポートを生成
        env:
          GROQ_API_KEY: ${{ secrets.CLAUDE_UPDATES_GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.CLAUDE_UPDATES_DISCORD_WEBHOOK_URL }}
        run: |
          python scripts/check-claude-updates.py

      - name: インデックスを更新
        run: |
          python scripts/generate-index.py

      - name: 変更を確認
        id: check_changes
        shell: bash
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            # 新しいレポートのバージョンを取得（最新のファイル名から抽出）
            shopt -s nullglob
            report_files=(reports/claude-code/*.md)
            latest_report=""
            for report_file in "${report_files[@]}"; do
              if [[ ${report_file##*/} == "index.md" ]]; then
                continue
              fi
              if [[ -z "$latest_report" || "$report_file" -nt "$latest_report" ]]; then
                latest_report=$report_file
              fi
            done
            if [[ -n "$latest_report" ]]; then
              filename=${latest_report##*/}
              if [[ $filename =~ v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
                version=${BASH_REMATCH[0]}
              else
                version="latest"
              fi
              echo "version=$version" >> "$GITHUB_OUTPUT"
            else
              echo "version=latest" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 変更をコミット＆プッシュ
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "[docs] Claude Code ${{ steps.check_changes.outputs.version }} の更新レポートを追加"
          git push

      - name: 失敗時に Discord へ通知
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.CLAUDE_UPDATES_DISCORD_WEBHOOK_URL }}
        run: |
          if [[ -n "$DISCORD_WEBHOOK_URL" ]]; then
            curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"⚠️ Claude Code 更新チェックが失敗しました。[Actions ログを確認してください](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}"
          fi
