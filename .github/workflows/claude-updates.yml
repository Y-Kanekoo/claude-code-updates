name: Claude Code Updates Report

on:
  # 毎日 9:00 JST (0:00 UTC) に自動実行
  schedule:
    - cron: '0 0 * * *'

  # 手動実行も可能
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'レポートを検証用成果物に保存し、公開・Discord送信を行わない'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: claude-updates-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  MAX_RELEASES_PER_RUN: ${{ vars.MAX_RELEASES_PER_RUN || '10' }}
  CLAUDE_UPDATES_GROQ_MODEL: ${{ vars.CLAUDE_UPDATES_GROQ_MODEL || 'openai/gpt-oss-120b' }}

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # 待機中に先行runがpushしても、開始時点のブランチ先端を取得する。
          ref: ${{ github.ref_name }}

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 前回の送信確認を復元
        id: restore_notifications
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore-notification-state.py

      - name: Groq API キーの期限を確認
        if: ${{ !inputs.dry_run }}
        env:
          QUEUE_NOTIFICATIONS: '1'
          CLAUDE_UPDATES_GROQ_API_KEY_EXPIRES_AT: ${{ vars.CLAUDE_UPDATES_GROQ_API_KEY_EXPIRES_AT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.CLAUDE_UPDATES_DISCORD_WEBHOOK_URL }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/check-groq-key-expiry.py

      - name: 依存パッケージをインストール
        run: pip install --require-hashes -r requirements.txt

      - name: レポートを生成
        id: generate_report
        env:
          GROQ_API_KEY: ${{ secrets.CLAUDE_UPDATES_GROQ_API_KEY }}
          CLAUDE_UPDATES_GROQ_MODEL: ${{ env.CLAUDE_UPDATES_GROQ_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check-claude-updates.py

      - name: インデックスを更新
        id: generate_index
        if: always()
        shell: bash
        run: |
          report_changes=$(git status --porcelain -- \
            reports/claude-code \
            ':(exclude)reports/claude-code/index.md' \
            ':(exclude)reports/claude-code/index.json' \
            ':(exclude)reports/claude-code/notification-state.json' \
            ':(exclude)reports/claude-code/summary-cache/**')
          if [[ -z "$report_changes" ]]; then
            echo "レポートの変更がないため、インデックス更新をスキップします"
            exit 0
          fi
          python scripts/generate-index.py
          echo "has_reports=true" >> "$GITHUB_OUTPUT"

      - name: 変更を確認
        id: check_changes
        if: always()
        shell: bash
        run: |
          report_changes=$(git status --porcelain -- reports/claude-code)
          if [[ -n "$report_changes" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            version=$(python -c '
          import json
          from pathlib import Path
          path = Path("reports/claude-code/last-checked.json")
          value = json.loads(path.read_text(encoding="utf-8")).get("last_version", "latest")
          print(value)
          ' 2>/dev/null || true)
            if [[ ! $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version=latest" >> "$GITHUB_OUTPUT"
            else
              echo "version=$version" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 変更をコミット＆プッシュ
        id: commit_reports
        if: >-
          ${{ always() && !inputs.dry_run && steps.generate_index.outcome == 'success' &&
          steps.check_changes.outputs.has_changes == 'true' }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add --all -- reports/claude-code
          if git diff --cached --quiet -- reports/claude-code; then
            echo "ステージ対象のレポート変更がないため、コミットをスキップします"
            exit 0
          fi
          git commit -m "[docs] Claude Code ${{ steps.check_changes.outputs.version }} の更新レポートを追加"
          git push

      - name: スライド更新トリガーを記録
        if: >-
          ${{ always() && steps.commit_reports.outcome == 'success' &&
          steps.generate_index.outputs.has_reports == 'true' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/slides-trigger"
          printf '%s\n' "${{ steps.check_changes.outputs.version }}" \
            > "$RUNNER_TEMP/slides-trigger/version.txt"

      - name: スライド更新トリガーを保存
        if: >-
          ${{ always() && steps.commit_reports.outcome == 'success' &&
          steps.generate_index.outputs.has_reports == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: slides-trigger
          path: ${{ runner.temp }}/slides-trigger/version.txt
          retention-days: 1
          if-no-files-found: error

      - name: 公開済みの更新と運用状態を Discord へ通知
        id: notify
        if: ${{ always() && !cancelled() && !inputs.dry_run && steps.restore_notifications.outcome == 'success' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.CLAUDE_UPDATES_DISCORD_WEBHOOK_URL }}
          FAILURE_TYPE: ${{ steps.generate_report.outputs.failure_type }}
          FAILED_VERSION: ${{ steps.generate_report.outputs.failed_version }}
          RUN_FAILED: ${{ job.status == 'failure' }}
          REPORTS_PUBLISHED: >-
            ${{ steps.generate_index.outcome == 'success' &&
            (steps.commit_reports.outcome == 'success' || steps.check_changes.outputs.has_changes == 'false') }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GROQ_LIMITS_URL: https://console.groq.com/settings/limits
          GROQ_BILLING_URL: https://console.groq.com/settings/billing/manage
        run: |
          if [[ "$FAILURE_TYPE" == "groq_rate_limit" ]]; then
            {
              echo '## Groq APIの利用上限に到達しました'
              if [[ "$REPORTS_PUBLISHED" == 'true' ]]; then
                echo '途中進捗は保持され、次回実行で続きから再開します。'
              fi
              echo "[利用上限]($GROQ_LIMITS_URL) / [料金設定（変更は任意）]($GROQ_BILLING_URL)"
              echo "[Actionsログを確認]($ACTIONS_RUN_URL)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          python scripts/notification_delivery.py

      - name: 送信確認を復元用成果物へ保存
        if: ${{ always() && !inputs.dry_run && steps.restore_notifications.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: notification-checkpoint
          path: reports/claude-code/notification-state.json
          retention-days: 90
          if-no-files-found: warn

      - name: 送信結果と障害の通知状態を保存
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if [[ ! -f reports/claude-code/notification-state.json ]]; then
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -- reports/claude-code/notification-state.json
          if git diff --cached --quiet -- reports/claude-code/notification-state.json; then
            exit 0
          fi
          git commit -m "[ops] 更新通知の送信結果を保存"
          git push

      - name: 検証用レポートと通知状態を保存
        if: ${{ always() && (inputs.dry_run || failure()) }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: report-preview
          path: reports/claude-code
          retention-days: 7
          if-no-files-found: warn
